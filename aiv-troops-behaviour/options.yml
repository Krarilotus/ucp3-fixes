meta:
  version: 1.0.0
options:
- name: aiv_troops_behaviour
  category:
  - '{{ai}}'
  - '{{troops_category}}'
  display: UCP2Switch
  header: '{{title}}'
  text: '{{description}}'
  url: aiv-troops-behaviour.enabled
  contents:
    type: boolean
    value: true
- name: aiv_troop_behavior
  category:
  - '{{ai}}'
  - '{{troops_category}}'
  display: UCP2Switch
  header: '{{behavior_title}}'
  text: '{{behavior_description}}'
  url: aiv-troops-behaviour.behavior.enabled
  enabled: aiv-troops-behaviour.enabled
  contents:
    type: boolean
    value: false
- name: all_ai_troop_defaults
  display: GroupBox
  header: '{{defaults_title}}'
  category:
  - '{{ai}}'
  - '{{troops_category}}'
  columns: 1
  children:
  - name: aic_overrides
    display: Switch
    text: '{{aic_overrides}}'
    url: aiv-troops-behaviour.behavior.aic_overrides
    enabled: aiv-troops-behaviour.behavior.enabled
    contents:
      value: true
  - name: aic_reference
    display: GroupBox
    header: '{{aic_help_title}}'
    text: '{{aic_help}}'
    accordion:
      enabled: true
    children: []
  - name: precedence_notice
    display: Paragraph
    text: '{{precedence_notice}}'
  - name: table_help
    display: Paragraph
    text: '{{table_help}}'
  - name: troop_defaults_table
    display: Group
    table:
      rowHeader: '{{table_unit}}'
      columns:
      - name: initial
        header: '{{table_role}}'
        choices:
        - name: defend
          text: '{{table_defend}}'
        - name: dig
          text: '{{table_dig}}'
        unselectedValues:
        - native
      - name: movement
        header: '{{table_movement}}'
        choices:
        - name: hold
          text: '{{table_hold}}'
        - name: patrol
          text: '{{table_patrol}}'
        unselectedValues:
        - native
    children:
    - name: all_troops
      display: GroupBox
      header: '{{table_all}}'
      columns: 2
      children:
      - name: InitialRole
        display: Choice
        text: '{{initial_role}}'
        url: aiv-troops-behaviour.behavior.defaults.InitialRole
        enabled: aiv-troops-behaviour.behavior.enabled
        contents:
          value: native
          choices:
          - name: native
            text: '{{native}}'
          - name: defend
            text: '{{defend}}'
      - name: Movement
        display: Choice
        text: '{{slot_movement}}'
        url: aiv-troops-behaviour.behavior.defaults.Movement
        enabled: aiv-troops-behaviour.behavior.enabled
        contents:
          value: native
          choices:
          - name: native
            text: '{{native}}'
          - name: hold
            text: '{{hold}}'
          - name: patrol
            text: '{{patrol}}'
    - name: troop_Engineer
      display: GroupBox
      header: '{{troop_Engineer}}'
      children:
      - name: InitialRole_Engineer
        display: Choice
        text: '{{initial_role}}'
        url: aiv-troops-behaviour.behavior.defaults.InitialRole_Engineer
        enabled: aiv-troops-behaviour.behavior.enabled
        contents:
          value: inherit
          choices:
          - name: inherit
            text: '{{inherit}}'
          - name: native
            text: '{{native}}'
          - name: defend
            text: '{{defend}}'
          - name: dig
            text: '{{dig}}'
        inheritFrom:
          url: aiv-troops-behaviour.behavior.defaults.InitialRole
          value: inherit
      - name: Movement_Engineer
        display: Choice
        text: '{{slot_movement}}'
        url: aiv-troops-behaviour.behavior.defaults.Movement_Engineer
        enabled: aiv-troops-behaviour.behavior.enabled
        contents:
          value: inherit
          choices:
          - name: inherit
            text: '{{inherit}}'
          - name: native
            text: '{{native}}'
          - name: hold
            text: '{{hold}}'
          - name: patrol
            text: '{{patrol}}'
        inheritFrom:
          url: aiv-troops-behaviour.behavior.defaults.Movement
          value: inherit
      columns: 2
    - name: troop_Archer
