table_help: Igény szerint válassz Védelem/Ásás és Tartás/Járőr között. Ha a Minden egység sorban nincs
  választás, a játék viselkedése marad. A többi sor ezt követi a módosításig. A visszaállítás újra öröklést
  használ. A vonal nem elérhető lehetőséget jelöl.
aic_help_title: AIC-mezők és elsőbbség
aic_help: 'MI-személyiségenként: egység AIC > közös AIC > egység menübeállítása > Minden egység > játékviselkedés.
  A mezőkhöz engedélyezd az AIC-felülírásokat.


  Kisbetűs szöveges értékeket használj: InitialRole = "defend" vagy "dig"; Movement = "hold" vagy "patrol".
  A kihagyott mező örököl. Számokat és kifejezett native/inherit értékeket nem használunk.


  "defend" = AIV-pozíciók védelme; "dig" = Várárok ásása; "hold" = Maradjon a kijelölt pozíción; "patrol"
  = Járőrözés az AIV-pozíciók között


  A "dig" csak az alábbi hat egységmezőnél használható, a közös InitialRole mezőnél nem. Ha az egység
  éppen nem tud ásni, a "defend" érvényesül.


  AIVTroops_InitialRole: "defend"

  AIVTroops_Movement: "hold", "patrol"

  AIVTroops_InitialRole_<Troop>: "defend" (+ "dig": Engineer, Archer, Spearman, Pikeman, Maceman, Slave)

  AIVTroops_Movement_<Troop>: "hold", "patrol"


  <Troop>:

  Engineer, Archer, Crossbowman, Spearman, Pikeman, Maceman, Swordsman, Knight, Slave, Slinger, Assassin,
  ArabianArcher, HorseArcher, ArabianSwordsman, FireThrower


  Példa: AIVTroops_InitialRole_Slave: "dig" és AIVTroops_Movement_Spearman: "patrol" ásó rabszolgákat
  és járőröző lándzsásokat ad egy MI-nek. A mezőnevek és értékek kis- és nagybetűérzékenyek. Módosítás
  után indítsd újra a játékot és kezdj új meccset.'
