table_help: Gerektiğinde Savun/Kaz ve Bekle/Devriye seçin. Tüm birlikler satırında seçim yoksa oyun davranışı
  korunur; diğer satırlar değiştirilene kadar bu satırı izler. Sıfırlama, devralmayı geri getirir. Tire,
  kullanılamayan seçeneği gösterir.
aic_help_title: AIC alanları ve öncelik
aic_help: 'Her yapay zekâ kişiliği için: birlik AIC > ortak AIC > birlik menü seçimi > Tüm birlikler >
  oyun davranışı. Bu alanlar için AIC geçersiz kılmalarını etkinleştirin.


  Küçük harfli metin değerleri kullanın: InitialRole = "defend" veya "dig"; Movement = "hold" veya "patrol".
  Atlanan alan ayarı devralır. Sayılar ve açık native/inherit değerleri kullanılmaz.


  "defend" = AIV konumlarını savun; "dig" = Hendek kaz; "hold" = Atanan konumda kal; "patrol" = AIV konumları
  arasında devriye gez


  "dig" yalnızca aşağıdaki altı birlik alanında kullanılabilir; ortak InitialRole alanında kullanılamaz.
  Birim o anda kazamıyorsa "defend" uygulanır.


  AIVTroops_InitialRole: "defend"

  AIVTroops_Movement: "hold", "patrol"

  AIVTroops_InitialRole_<Troop>: "defend" (+ "dig": Engineer, Archer, Spearman, Pikeman, Maceman, Slave)

  AIVTroops_Movement_<Troop>: "hold", "patrol"


  <Troop>:

  Engineer, Archer, Crossbowman, Spearman, Pikeman, Maceman, Swordsman, Knight, Slave, Slinger, Assassin,
  ArabianArcher, HorseArcher, ArabianSwordsman, FireThrower


  Örnek: AIVTroops_InitialRole_Slave: "dig" ve AIVTroops_Movement_Spearman: "patrol", bir yapay zekâya
  kazan köleler ve devriye gezen mızraklılar verir. Alan adları ve değerler büyük/küçük harfe duyarlıdır.
  Değişiklikten sonra oyunu yeniden başlatıp yeni bir oyun açın.'
