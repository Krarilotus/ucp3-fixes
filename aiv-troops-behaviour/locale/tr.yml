title: 'Yapay zekâ: AIV birlik davranışı'
description: Mızraklı muhafızların, kılıçlıların ve Arap kılıçlıların eksik AIV konumlarını geri getirir.
  Aşağıdaki ayarlarla diğer yapay zekâ birliklerinin davranışı da değiştirilebilir.
behavior_title: 'Deneysel: birlik ayarları'
behavior_description: Hangi başlangıç birliklerinin savunma yapacağını veya hendek kazacağını ve savunmacıların
  yerinde mi kalacağını yoksa devriye mi gezeceğini seçin. Kazma yalnızca bunu yapabilen birliklerde seçilebilir.
  Değişikliklerden sonra oyunu yeniden başlatıp yeni bir maç açın.
defaults_title: Tüm yapay zekâlar için varsayılan birlik ayarları
precedence_notice: Bu varsayılanlar tüm yapay zekâlara uygulanır. Etkin AIC ayarları önceliklidir; eksik
