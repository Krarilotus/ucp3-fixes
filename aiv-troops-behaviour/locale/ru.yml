table_help: 'Для каждого типа войск выбирайте не более одного варианта в каждой паре. Защита: занять позиции AIV; Рытьё: назначить начальные войска копать ров. Стоять: удерживать оборонительную позицию; Патруль: перемещаться между позициями по настройкам патруля AIC этого ИИ. Сброс возвращает поведение игры.'
