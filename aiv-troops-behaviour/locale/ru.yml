description: Восстанавливает отсутствующие позиции AIV для пикинёров, мечников и арабских мечников. Настройки
  ниже позволяют менять поведение и других войск ИИ.
behavior_title: Настройки войск
behavior_description: Выберите, какие стартовые войска защищают замок или роют ров, а также стоят ли защитники
  на месте или патрулируют. Рытьё доступно только подходящим войскам. После изменений перезапустите игру
  и начните новую партию.
defaults_title: Настройки войск для всех ИИ
precedence_notice: Эти настройки действуют для всех ИИ. При включённой замене значения AIC имеют приоритет;
