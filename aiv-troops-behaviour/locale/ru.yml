table_help: При необходимости выберите Защита/Рытьё и Стоять/Патруль. Без выбора в строке Все войска сохраняется
  поведение игры; остальные строки следуют ей до изменения. Сброс возвращает наследование. Прочерк означает
  недоступный вариант.
aic_help_title: Поля AIC и приоритет
aic_help: 'Для каждой личности ИИ: AIC типа войск > общий AIC > выбор типа войск в меню > Все войска >
  поведение игры. Для этих полей включите переопределения AIC.


  Используйте текст в нижнем регистре: InitialRole = "defend" или "dig"; Movement = "hold" или "patrol".
  Пропущенное поле наследует настройку. Числа и явные значения native/inherit не используются.


  "defend" = Защищать позиции AIV; "dig" = Рыть ров; "hold" = Оставаться на назначенной позиции; "patrol"
  = Патрулировать между позициями AIV


  "dig" разрешено только для шести полей войск ниже, но не для общего InitialRole. Если юнит сейчас не
  может копать, используется "defend".


  AIVTroops_InitialRole: "defend"

  AIVTroops_Movement: "hold", "patrol"

  AIVTroops_InitialRole_<Troop>: "defend" (+ "dig": Engineer, Archer, Spearman, Pikeman, Maceman, Slave)

  AIVTroops_Movement_<Troop>: "hold", "patrol"


  <Troop>:

  Engineer, Archer, Crossbowman, Spearman, Pikeman, Maceman, Swordsman, Knight, Slave, Slinger, Assassin,
  ArabianArcher, HorseArcher, ArabianSwordsman, FireThrower


  Пример: AIVTroops_InitialRole_Slave: "dig" и AIVTroops_Movement_Spearman: "patrol" назначают одному
  ИИ рабов-землекопов и патрулирующих копейщиков. Регистр имён и значений важен. После изменений перезапустите
  игру и начните новую партию.'
