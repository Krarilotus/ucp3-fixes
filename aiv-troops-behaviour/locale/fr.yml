table_help: Choisissez Défendre/Creuser et Rester/Patrouille si nécessaire. Sans choix dans Toutes les
  troupes, le jeu garde son comportement. Les autres lignes suivent cette ligne jusqu’à modification.
  Réinitialiser rétablit l’héritage. Un tiret signifie indisponible.
aic_help_title: Champs AIC et priorité
aic_help: 'Pour chaque personnalité IA : AIC de la troupe > AIC commun > choix de la troupe dans le menu
  > Toutes les troupes > comportement du jeu. Activez les remplacements AIC pour utiliser ces champs.


  Utilisez des textes en minuscules : InitialRole = "defend" ou "dig" ; Movement = "hold" ou "patrol".
  Omettez un champ pour hériter. Les nombres et les valeurs explicites native/inherit ne sont pas utilisés.


  "defend" = Défendre les positions AIV; "dig" = Creuser des douves; "hold" = Rester à la position assignée;
  "patrol" = Patrouiller entre les positions AIV


  "dig" est réservé aux six champs de troupes ci-dessous, pas au champ InitialRole commun. Une unité incapable
  de creuser au moment de l’affectation utilise "defend".


  AIVTroops_InitialRole: "defend"

  AIVTroops_Movement: "hold", "patrol"

  AIVTroops_InitialRole_<Troop>: "defend" (+ "dig": Engineer, Archer, Spearman, Pikeman, Maceman, Slave)

  AIVTroops_Movement_<Troop>: "hold", "patrol"


  <Troop>:

  Engineer, Archer, Crossbowman, Spearman, Pikeman, Maceman, Swordsman, Knight, Slave, Slinger, Assassin,
  ArabianArcher, HorseArcher, ArabianSwordsman, FireThrower


  Exemple : AIVTroops_InitialRole_Slave: "dig" et AIVTroops_Movement_Spearman: "patrol" donnent à une
  IA des esclaves qui creusent et des lanciers qui patrouillent. Respectez la casse des champs et des
  valeurs. Redémarrez le jeu et commencez une nouvelle partie après modification.'
