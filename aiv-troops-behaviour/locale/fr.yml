fixes: Correctifs
title: 'IA : Comportement des troupes AIV'
description: Rétablit les positions AIV manquantes des piquiers, épéistes et épéistes arabes. Les réglages
  ci-dessous permettent aussi de modifier le comportement des autres troupes de l’IA.
behavior_title: Réglages des troupes
behavior_description: Choisissez les troupes de départ qui défendent ou creusent des douves, et si les
  défenseurs restent en place ou patrouillent. Seules les troupes capables de creuser ont cette option.
  Après modification, redémarrez le jeu et lancez une nouvelle partie.
defaults_title: Réglages des troupes pour toutes les IA
precedence_notice: Ces réglages s’appliquent à toutes les IA. Les valeurs AIC ont priorité si leur utilisation
  est activée ; les valeurs absentes utilisent ces réglages.
aic_overrides: Autoriser les valeurs AIC à remplacer ces réglages
