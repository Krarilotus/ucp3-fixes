table_help: 按需选择防守/挖掘和驻守/巡逻。“所有部队”行未选择时保留游戏行为；其他行在修改前沿用该行。重置可恢复继承。横线表示不可用。
aic_help_title: AIC字段与优先级
aic_help: '每个AI性格的优先级：兵种AIC > 通用AIC > 兵种菜单选项 > 所有部队 > 游戏行为。需启用AIC覆盖才能使用这些字段。


  使用小写文本值：InitialRole = "defend"或"dig"；Movement = "hold"或"patrol"。省略字段即可继承。不使用数值或显式native/inherit值。


  "defend" = 防守AIV位置; "dig" = 挖掘护城河; "hold" = 留在指定位置; "patrol" = 在AIV位置之间巡逻


  "dig"仅适用于下列六个兵种字段，不适用于通用InitialRole字段。单位当前无法挖掘时使用"defend"。


  AIVTroops_InitialRole: "defend"

  AIVTroops_Movement: "hold", "patrol"

  AIVTroops_InitialRole_<Troop>: "defend" (+ "dig": Engineer, Archer, Spearman, Pikeman, Maceman, Slave)

  AIVTroops_Movement_<Troop>: "hold", "patrol"


  <Troop>:

  Engineer, Archer, Crossbowman, Spearman, Pikeman, Maceman, Swordsman, Knight, Slave, Slinger, Assassin,
  ArabianArcher, HorseArcher, ArabianSwordsman, FireThrower


  示例：AIVTroops_InitialRole_Slave: "dig"和AIVTroops_Movement_Spearman: "patrol"让一个AI使用挖掘的奴隶和巡逻的长矛兵。字段名和值区分大小写。修改后重启游戏并开始新对局。'
