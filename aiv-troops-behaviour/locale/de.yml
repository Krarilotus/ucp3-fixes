table_help: Bei Bedarf Wache/Graben und Halten/Patrouille wählen. Ohne Auswahl bei Alle Truppen gilt das
  Spielverhalten; andere Zeilen folgen Alle Truppen, bis sie geändert werden. Zurücksetzen stellt die
  Vererbung wieder her. Ein Strich bedeutet nicht verfügbar.
aic_help_title: AIC-Felder und Priorität
aic_help: 'Pro KI-Persönlichkeit gilt: Truppen-AIC > gemeinsame AIC > Truppenauswahl im Menü > Alle Truppen
  > Spielverhalten. Dafür AIC-Überschreibungen aktivieren.


  Kleingeschriebene Textwerte verwenden: InitialRole = "defend" oder "dig"; Movement = "hold" oder "patrol".
  Fehlende Felder erben. Zahlenwerte und ausdrückliche native/inherit-Werte werden nicht verwendet.


  "defend" = AIV-Positionen verteidigen; "dig" = Gräben ausheben; "hold" = An der zugewiesenen Position
  bleiben; "patrol" = Zwischen AIV-Positionen patrouillieren


  "dig" ist nur bei den sechs unten aufgeführten Truppenfeldern erlaubt, nicht beim gemeinsamen InitialRole-Feld.
  Kann eine Einheit aktuell nicht graben, gilt "defend".


  AIVTroops_InitialRole: "defend"

  AIVTroops_Movement: "hold", "patrol"

  AIVTroops_InitialRole_<Troop>: "defend" (+ "dig": Engineer, Archer, Spearman, Pikeman, Maceman, Slave)

  AIVTroops_Movement_<Troop>: "hold", "patrol"


  <Troop>:

  Engineer, Archer, Crossbowman, Spearman, Pikeman, Maceman, Swordsman, Knight, Slave, Slinger, Assassin,
  ArabianArcher, HorseArcher, ArabianSwordsman, FireThrower


  Beispiel: AIVTroops_InitialRole_Slave: "dig" und AIVTroops_Movement_Spearman: "patrol" geben einer KI
  grabende Sklaven und patrouillierende Speerträger. Groß-/Kleinschreibung beachten. Nach Änderungen das
  Spiel neu starten und eine neue Partie beginnen.'
