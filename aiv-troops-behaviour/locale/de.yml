title: 'KI: AIV-Truppenverhalten'
description: Stellt fehlende AIV-Positionen für Pikeniere, Schwertkämpfer und arabische Schwertkämpfer
  wieder her. Mit den Truppeneinstellungen unten lässt sich auch das Verhalten anderer KI-Truppen anpassen.
