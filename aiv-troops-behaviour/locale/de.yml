ai: KI
behavior_title: Truppeneinstellungen
behavior_description: Festlegen, welche Starttruppen verteidigen oder Gräben ausheben und ob Verteidiger
  an ihren Positionen bleiben oder patrouillieren. Graben ist nur für geeignete Truppen wählbar. Nach
  Änderungen das Spiel neu starten und eine neue Partie beginnen.
fixes: Fehlerbehebungen
title: 'KI: AIV-Truppenverhalten'
description: Behebt fehlende AIV-Positionen für Pikeniere und beide Schwertkämpfertypen. Optionale Truppeneinstellungen
  steuern Verteidigen, Graben, Halten und Patrouillieren. AIC-Werte pro KI überschreiben die Menüvorgaben.
defaults_title: Standardwerte für die Truppen aller KIs
precedence_notice: Diese Standardwerte gelten für jede KI. Aktivierte AIC-Vorgaben haben Vorrang; fehlende
  AIC-Werte übernehmen diese Standardwerte.
aic_overrides: Standardwerte durch AIC-Einstellungen überschreiben lassen
