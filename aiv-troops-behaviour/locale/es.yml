table_help: Elige Defender/Cavar y Mantener/Patrullar cuando sea necesario. Sin selección en Todas las
  tropas se conserva el comportamiento del juego; las demás filas la siguen hasta modificarlas. Restablecer
  recupera la herencia. Un guion significa no disponible.
aic_help_title: Campos AIC y prioridad
aic_help: 'Por personalidad de IA: AIC de tropa > AIC común > elección de tropa en el menú > Todas las
  tropas > comportamiento del juego. Activa las anulaciones AIC para usar estos campos.


  Usa textos en minúsculas: InitialRole = "defend" o "dig"; Movement = "hold" o "patrol". Omite un campo
  para heredar. No se usan números ni valores explícitos native/inherit.


  "defend" = Defender posiciones AIV; "dig" = Cavar fosos; "hold" = Quedarse en la posición asignada;
  "patrol" = Patrullar entre posiciones AIV


  "dig" solo se permite en los seis campos de tropa indicados abajo, no en el InitialRole común. Si la
  unidad no puede cavar en ese momento, se aplica "defend".


  AIVTroops_InitialRole: "defend"

  AIVTroops_Movement: "hold", "patrol"

  AIVTroops_InitialRole_<Troop>: "defend" (+ "dig": Engineer, Archer, Spearman, Pikeman, Maceman, Slave)

  AIVTroops_Movement_<Troop>: "hold", "patrol"


  <Troop>:

  Engineer, Archer, Crossbowman, Spearman, Pikeman, Maceman, Swordsman, Knight, Slave, Slinger, Assassin,
  ArabianArcher, HorseArcher, ArabianSwordsman, FireThrower


  Ejemplo: AIVTroops_InitialRole_Slave: "dig" y AIVTroops_Movement_Spearman: "patrol" asignan esclavos
  excavadores y lanceros patrulleros a una IA. Los nombres y valores distinguen mayúsculas y minúsculas.
  Reinicia el juego y comienza una partida nueva tras los cambios.'
