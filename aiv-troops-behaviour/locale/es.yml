table_help: 'Por cada tropa, elige como máximo una opción de cada par. Defender: ir a las posiciones AIV; Cavar: asignar las tropas iniciales a cavar fosos. Mantener: permanecer en un puesto defensivo; Patrullar: recorrer los puestos según los ajustes de patrulla AIC de la IA. Pulsa de nuevo una casilla marcada para desmarcar el par y usar el comportamiento del juego.'
