table_help: در صورت نیاز دفاع/حفاری و توقف/گشت را انتخاب کنید. بدون انتخاب در ردیف همهٔ نیروها، رفتار
  بازی حفظ می‌شود؛ ردیف‌های دیگر تا زمان تغییر از آن پیروی می‌کنند. بازنشانی، ارث‌بری را برمی‌گرداند.
  خط تیره یعنی گزینه در دسترس نیست.
aic_help_title: فیلدهای AIC و اولویت
aic_help: 'برای هر شخصیت هوش مصنوعی: AIC نوع نیرو > AIC عمومی > انتخاب نیرو در منو > همهٔ نیروها > رفتار
  بازی. برای استفاده از این فیلدها، بازنویسی AIC را فعال کنید.


  از مقادیر متنی با حروف کوچک استفاده کنید: InitialRole = "defend" یا "dig"؛ Movement = "hold" یا "patrol".
  فیلد حذف‌شده تنظیم را به ارث می‌برد. اعداد و مقادیر صریح native/inherit استفاده نمی‌شوند.


  "defend" = دفاع از موقعیت‌های AIV; "dig" = حفر خندق; "hold" = ماندن در موقعیت تعیین‌شده; "patrol" =
  گشت‌زنی بین موقعیت‌های AIV


  "dig" فقط برای شش فیلد نیروی زیر مجاز است، نه فیلد عمومی InitialRole. اگر نیرو اکنون نتواند حفاری کند،
  "defend" اعمال می‌شود.


  AIVTroops_InitialRole: "defend"

  AIVTroops_Movement: "hold", "patrol"

  AIVTroops_InitialRole_<Troop>: "defend" (+ "dig": Engineer, Archer, Spearman, Pikeman, Maceman, Slave)

  AIVTroops_Movement_<Troop>: "hold", "patrol"


  <Troop>:

  Engineer, Archer, Crossbowman, Spearman, Pikeman, Maceman, Swordsman, Knight, Slave, Slinger, Assassin,
  ArabianArcher, HorseArcher, ArabianSwordsman, FireThrower


  مثال: AIVTroops_InitialRole_Slave: "dig" و AIVTroops_Movement_Spearman: "patrol" به یک هوش مصنوعی بردگان
  حفار و نیزه‌داران گشتی می‌دهد. نام فیلدها و مقادیر به بزرگی و کوچکی حروف حساس‌اند. پس از تغییر، بازی
  را دوباره اجرا کنید و نبرد جدیدی آغاز کنید.'
