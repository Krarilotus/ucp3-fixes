table_help: 'برای هر نوع نیرو، از هر جفت حداکثر یک گزینه را انتخاب کنید. دفاع: رفتن به موقعیت‌های AIV؛ حفاری: گماشتن نیروهای آغازین به کندن خندق. توقف: ماندن در جایگاه دفاعی؛ گشت: حرکت میان جایگاه‌های دفاعی طبق تنظیمات گشت AIC همان هوش مصنوعی. برای پاک کردن انتخاب آن جفت و استفاده از رفتار پیش‌فرض بازی، دوباره روی خانهٔ انتخاب‌شده کلیک کنید.'
