ai: هوش مصنوعی
fixes: رفع اشکال
title: 'هوش مصنوعی: رفتار نیروها در AIV'
description: موقعیت‌های ازدست‌رفتهٔ AIV برای نیزه‌داران زره‌پوش، شمشیرزنان و شمشیرزنان عرب را برمی‌گرداند.
  با تنظیمات زیر می‌توان رفتار دیگر نیروهای هوش مصنوعی را هم تغییر داد.
behavior_title: تنظیمات نیروها
behavior_description: انتخاب کنید کدام نیروهای آغازین دفاع کنند یا خندق بکنند و مدافعان در جای خود بمانند
  یا گشت بزنند. حفر خندق فقط برای نیروهای دارای این توانایی قابل انتخاب است. پس از تغییرات، بازی را دوباره
  اجرا کنید و یک نبرد تازه آغاز کنید.
defaults_title: تنظیمات پیش‌فرض نیروها برای همهٔ هوش‌های مصنوعی
precedence_notice: این پیش‌فرض‌ها برای همهٔ هوش‌های مصنوعی هستند. اگر جایگزینی با AIC فعال باشد، مقادیر
  AIC اولویت دارند؛ مقادیر تعیین‌نشده از این پیش‌فرض‌ها استفاده می‌کنند.
aic_overrides: اجازهٔ جایگزینی این پیش‌فرض‌ها با تنظیمات AIC
