buildings: Binalar işçilerin üzerine yerleştirilebilir
buildings_tooltip: Kendi işçilerinin bulunduğu yere bina yerleştirebilirsin. Yeni binanın yanındaki en yakın boş kareye çekilip işlerine devam ederler. Askerler ve düşman birimleri eskisi gibi alanı engellemeye devam eder. Kapatıldığında oyunun özgün bina yerleştirme davranışı geri döner.
walls: Surlar işçilerin üzerine yerleştirilebilir
walls_tooltip: 'Surlar için de aynısı geçerlidir: yolda duran işçiler mümkünse bulundukları tarafta kalacak şekilde surun yanına çekilir. Kapatıldığında oyuncu ve yapay zekâ için özgün sur yerleştirme geri döner.'
keep_on_walls: Sur onarımı üstündeki birimleri yerinde bırakır
keep_on_walls_tooltip: Bir suru onardığında surun veya merdivenin üstünde duran askerler ve siviller yerlerinde kalır. Yalnızca yeni bir surun altında zeminde duranlar kenara çekilir.
allies: Müttefik işçileri dost sayılır
allies_tooltip: Takımındaki oyuncuların işçilerinin üzerine de inşa edilebilir. Kapalıyken yalnızca kendi işçilerin için geçerlidir.
balance_changes: Denge değişiklikleri
bugfixes: Hata düzeltmeleri
