buildings: امکان ساخت ساختمان روی کارگران
buildings_tooltip: می‌توانید ساختمان را روی جایگاه کارگران خودتان قرار دهید. آن‌ها به نزدیک‌ترین خانهٔ خالی کنار ساختمان جدید کنار می‌روند و کارشان را ادامه می‌دهند. سربازان و واحدهای دشمن مانند قبل مانع ساخت می‌شوند. خاموش کردن آن رفتار اصلی ساخت ساختمان را برمی‌گرداند.
walls: امکان ساخت دیوار روی کارگران
walls_tooltip: 'همین رفتار برای دیوارها: کارگران سر راه کنار دیوار جابه‌جا می‌شوند و تا حد امکان در همان سمتی که بودند می‌مانند. خاموش کردن آن رفتار اصلی دیوارسازی انسان و هوش مصنوعی را برمی‌گرداند.'
keep_on_walls: تعمیر دیوار افراد روی آن را جابه‌جا نمی‌کند
keep_on_walls_tooltip: سربازان و افرادی که روی دیوار یا پله ایستاده‌اند هنگام تعمیر آن دیوار سر جایشان می‌مانند. تنها افرادی که روی زمین زیر یک دیوار جدید باشند کنار زده می‌شوند.
allies: کارگران متحدان نیز خودی به شمار می‌آیند
allies_tooltip: روی کارگران بازیکنان هم‌تیمی شما نیز می‌توان ساخت‌وساز کرد. وقتی خاموش باشد، تنها برای کارگران خودتان کار می‌کند.
balance_changes: تغییرات توازن
bugfixes: رفع اشکال
