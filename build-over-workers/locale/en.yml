buildings: Buildings can be placed over workers
buildings_tooltip: You can place a building on top of your own workers. They step aside to the closest free tile next to the new building and carry on with their job.
walls: Walls can be placed over workers
walls_tooltip: 'The same for walls: workers standing in the way are moved next to the wall, on the side they were on when possible.'
keep_on_walls: Repairing a wall leaves people on top of it
keep_on_walls_tooltip: Troops and people standing on top of a wall or stairs stay where they are when you repair that wall.
allies: Allies' workers count as friendly
allies_tooltip: Workers of players on your team can be built over too.
