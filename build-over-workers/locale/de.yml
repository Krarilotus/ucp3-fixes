buildings: Gebäude über Arbeitern platzieren
buildings_tooltip: Du kannst Gebäude direkt auf deinen eigenen Arbeitern platzieren. Sie treten auf das nächste freie Feld neben dem neuen Gebäude zur Seite und setzen ihre Arbeit fort. Soldaten und feindliche Einheiten blockieren den Bauplatz weiterhin wie gewohnt. Ist dies deaktiviert, gilt wieder die ursprüngliche Gebäudeplatzierung.
walls: Mauern über Arbeitern platzieren
walls_tooltip: 'Dasselbe für Mauern: Im Weg stehende Arbeiter werden neben die Mauer verschoben, möglichst auf dieselbe Seite, auf der sie standen. Ist dies deaktiviert, gilt wieder die ursprüngliche Mauerplatzierung für Menschen und KI.'
keep_on_walls: Reparieren lässt Truppen auf Mauern stehen
keep_on_walls_tooltip: Truppen und Personen auf einer Mauer oder Treppe bleiben beim Reparieren dieser Mauer stehen. Nur Personen am Boden unter einer neuen Mauer werden beiseitegeschoben.
allies: Arbeiter Verbündeter gelten als freundlich
allies_tooltip: Auch über Arbeitern von Verbündeten deines Teams darf gebaut werden. Ist dies deaktiviert, gilt das nur für deine eigenen Arbeiter.
balance_changes: Balance-Änderungen
bugfixes: Fehlerkorrekturen
tags.behavior: Verhalten
tags.bugfixes: Fehlerkorrekturen
