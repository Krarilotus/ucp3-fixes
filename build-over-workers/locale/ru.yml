buildings: Разрешить строить здания поверх рабочих
buildings_tooltip: Вы можете ставить здания прямо на своих рабочих. Они отходят на ближайшую свободную клетку рядом с новым зданием и продолжают работу. Солдаты и вражеские юниты по-прежнему мешают строительству. Отключение возвращает оригинальное размещение зданий.
walls: Разрешить строить стены поверх рабочих
walls_tooltip: 'То же для стен: рабочие на пути сдвигаются рядом со стеной, по возможности с той же стороны, где стояли. Отключение возвращает оригинальное размещение стен для игроков и ИИ.'
keep_on_walls: Ремонт стены оставляет людей наверху
keep_on_walls_tooltip: Войска и жители на стене или лестнице остаются на месте при ремонте этой стены. В сторону сдвигаются только те, кто стоит на земле под новой стеной.
allies: Рабочие союзников считаются дружественными
allies_tooltip: Строить можно и поверх рабочих игроков вашей команды. Если отключено, это действует только для ваших собственных рабочих.
balance_changes: Изменения баланса
bugfixes: Исправления
