reachable_delivery: تحویل به انبار غله و اسلحه‌خانه
reachable_delivery_descr: کارگران از مسیر خود به انبار غله و اسلحه‌خانه می‌روند. اگر مسیر قلعه بسته باشد، هوش مصنوعی این ساختمان‌ها را نگه می‌دارد. به‌صورت پیش‌فرض خاموش است؛ افزونهٔ UCP3 Fixes آن را روشن می‌کند. پس از تغییر، بازی را دوباره اجرا کنید.
