reachable_delivery: Szállítás magtárba és fegyvertárba
reachable_delivery_descr: A munkások a saját útjukon jutnak el a magtárba és a fegyvertárba. Az MI megtartja ezeket, ha a vártoronytól vezető út elzáródik. Alapértelmezés szerint ki van kapcsolva; az UCP3 Fixes bővítmény kapcsolja be. Módosítás után indítsd újra a játékot.
