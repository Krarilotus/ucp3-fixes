reachable_delivery: Доставка в амбары и оружейные
reachable_delivery_descr: Рабочие идут к амбарам и оружейным своим путём. ИИ сохраняет эти здания, если путь от цитадели перекрыт. По умолчанию отключено; плагин UCP3 Fixes включает это исправление. После изменения перезапустите игру.
