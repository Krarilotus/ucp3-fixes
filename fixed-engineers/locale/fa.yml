bugfixes: رفع اشکال
crew_lifecycle: حذف خدمهٔ ابزار محاصره
crew_lifecycle_descr: پاک‌سازی انجام‌نشدهٔ خدمهٔ محاصره را اصلاح می‌کند و هنگام خروج
  از تجهیزات، ارجاع‌های قدیمی خدمه را رد می‌کند. مهندسان زنده هویت و سلامتی خود را
  حفظ می‌کنند. پس از تغییر تنظیم، بازی را دوباره اجرا کنید.
siege_target_stop: توقف ادوات محاصره هنگام هدف‌گیری
siege_target_stop_descr: منجنیق‌ها هنگام دریافت فرمان حمله به یک واحد، حرکت را متوقف می‌کنند.
  پس از تغییر این گزینه، بازی را دوباره اجرا کنید.
