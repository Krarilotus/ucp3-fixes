bugfixes: Corrections
crew_lifecycle: Suppression des équipages de siège
crew_lifecycle_descr: Corrige la suppression ignorée des équipages de siège et rejette
  les références périmées lors de la sortie d'un engin. Les ingénieurs survivants
  conservent leur identité et leur santé. Redémarrez le jeu après une modification.
siege_target_stop: Arrêter les engins de siège pour viser
siege_target_stop_descr: Les catapultes et trébuchets s'arrêtent quand ils reçoivent l'ordre
  d'attaquer une unité. Redémarrez le jeu après modification.
tags.bugfixes: Corrections
