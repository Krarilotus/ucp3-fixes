crew_lifecycle: Ostromgép legénységének eltávolítása
crew_lifecycle_descr: Javítja az ostromgépek legénységének elmaradt eltávolítását, és kiszálláskor elutasítja az elavult hivatkozásokat. A túlélő mérnökök megőrzik azonosítójukat és életerejüket. Alapértelmezés szerint ki van kapcsolva; az UCP3 Fixes bővítmény kapcsolja be. Módosítás után indítsd újra a játékot.
siege_target_stop: Ostromgépek megállítása célzáskor
siege_target_stop_descr: A katapultok és hajítógépek megállnak, ha egység megtámadására kapnak parancsot. Alapértelmezés szerint ki van kapcsolva; az UCP3 Fixes bővítmény kapcsolja be. Módosítás után indítsd újra a játékot.
