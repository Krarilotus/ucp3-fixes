crew_lifecycle_descr: Javítja az ostromgépek legénységének elmaradt eltávolítását,
  és kiszálláskor elutasítja az elavult hivatkozásokat. A túlélő mérnökök megőrzik
  azonosítójukat és életerejüket. Módosítás után indítsd újra a játékot.
