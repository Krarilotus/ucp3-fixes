bugfixes: Исправления
crew_lifecycle: Удаление осадного экипажа
crew_lifecycle_descr: Исправляет пропуск удаления осадных экипажей и отклоняет устаревшие ссылки при выходе из машины. Выжившие инженеры сохраняют свою личность и здоровье. По умолчанию отключено; плагин UCP3 Fixes включает это исправление. После изменения перезапустите игру.
siege_target_stop: Останавливать осадные орудия при прицеливании
siege_target_stop_descr: Катапульты и требюше останавливаются при приказе атаковать отряд. По умолчанию отключено; плагин UCP3 Fixes включает это исправление. После изменения настройки перезапустите игру.
tags.bugfixes: Исправления
