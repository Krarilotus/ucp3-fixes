meta:
  version: 1.0.0
options:
- name: aiv_troop_spot_fix
  category:
  - '{{ai}}'
  - '{{fixes}}'
  display: UCP2Switch
  header: '{{title}}'
  text: '{{description}}'
  url: aiv-troop-spot-fix.enabled
  contents:
    type: boolean
    value: true
- name: aiv_troop_behavior
  category:
  - '{{ai}}'
  - '{{fixes}}'
  display: UCP2Switch
  header: '{{behavior_title}}'
  text: '{{behavior_description}}'
  url: aiv-troop-spot-fix.behavior.enabled
  enabled: aiv-troop-spot-fix.enabled
  contents:
    type: boolean
    value: false
- name: all_ai_troop_defaults
  display: GroupBox
  header: '{{defaults_title}}'
  category:
  - '{{ai}}'
  - '{{fixes}}'
  columns: 1
  children:
  - name: precedence_notice
    display: Paragraph
    text: '{{precedence_notice}}'
  - name: aic_overrides
    display: Switch
    text: '{{aic_overrides}}'
    url: aiv-troop-spot-fix.behavior.aic_overrides
    enabled: aiv-troop-spot-fix.behavior.enabled
    contents:
      value: true
  - name: InitialRole
    display: Choice
    text: '{{initial_role}}'
    url: aiv-troop-spot-fix.behavior.defaults.InitialRole
    enabled: aiv-troop-spot-fix.behavior.enabled
    contents:
      value: native
      choices:
      - name: native
        text: '{{native}}'
      - name: defend
        text: '{{defend}}'
  - name: Movement
    display: Choice
    text: '{{slot_movement}}'
    url: aiv-troop-spot-fix.behavior.defaults.Movement
    enabled: aiv-troop-spot-fix.behavior.enabled
    contents:
      value: native
      choices:
      - name: native
        text: '{{native}}'
      - name: hold
        text: '{{hold}}'
      - name: patrol
        text: '{{patrol}}'
  - name: troop_Engineer
    display: GroupBox
    header: '{{troop_Engineer}}'
    children:
    - name: InitialRole_Engineer
      display: Choice
      text: '{{initial_role}}'
      url: aiv-troop-spot-fix.behavior.defaults.InitialRole_Engineer
      enabled: aiv-troop-spot-fix.behavior.enabled
      contents:
        value: inherit
        choices:
        - name: inherit
          text: '{{inherit}}'
        - name: native
          text: '{{native}}'
        - name: defend
          text: '{{defend}}'
        - name: dig
          text: '{{dig}}'
    - name: Movement_Engineer
      display: Choice
      text: '{{slot_movement}}'
      url: aiv-troop-spot-fix.behavior.defaults.Movement_Engineer
