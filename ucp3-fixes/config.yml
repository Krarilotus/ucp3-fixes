# UCP3 Fixes: turns on the bug fixes of its dependencies, which are off by
# default. Suggested values stay editable in Customizations. Interface & Visual
# Fixes' two interface features and its Ghost Objects repair are not set here.
meta:
  version: 1.0.0
config-sparse:
  modules:
    worker-delivery-fix:
      config:
        reachable_delivery:
          contents:
            suggested-value: true
    gatehouse-capture-fix:
      config:
        living_gatehouse_occupants:
          contents:
            suggested-value: true
    hunter-targeting-fix:
      config:
        hunter_targeting:
          contents:
            suggested-value: true
    fixed-engineers:
      config:
        siege_target_stop:
          contents:
            suggested-value: true
        crew_lifecycle:
          contents:
            suggested-value: true
    hopfarm-limit-fix:
      config:
        enabled:
          contents:
            suggested-value: true
    aiv-troops-behaviour:
      config:
        enabled:
          contents:
            suggested-value: true
    interface-visual-fixes:
      config:
        clear-unique-building-preview:
          contents:
            suggested-value: true
        building-preview-during-camera-movement:
          contents:
            suggested-value: true
        distinct-dead-tree-sprites:
          contents:
            suggested-value: true
        tower-door-height:
          contents:
            suggested-value: true
        cliff-texture-direction:
          contents:
            suggested-value: true
    audio-fixes:
      config:
        startup-sfx-volume:
          contents:
            suggested-value: true
        video-fx-volume:
          contents:
            suggested-value: true
        positional-audio:
          contents:
            suggested-value: true
  plugins: {}
