map_settings_descr: نیروها، سلاح‌ها و کالاهایی که در ویرایشگر سناریو ممنوع شده‌اند، در نبرد آزاد، چندنفره و «بازی روی نقشه» ممنوع می‌مانند. همهٔ بازیکنان باید تنظیم یکسانی داشته باشند. پس از تغییر، بازی را دوباره اجرا کنید.
