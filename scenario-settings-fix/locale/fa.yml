map_settings: تنظیمات دسترسی نقشه
map_settings_descr: در نبرد آزاد، چندنفره و «بازی روی نقشه»، نیروها، سلاح‌ها و کالاهایی که نقشه در ویرایشگر سناریو ممنوع کرده ممنوع می‌مانند. همهٔ بازیکنان باید تنظیم یکسانی داشته باشند. پس از تغییر، بازی را دوباره اجرا کنید.
