map_settings_descr: Csatában, többjátékos módban és a „Térkép játszása” módban érvényesek a térkép forgatókönyv-szerkesztőben tiltott egységei, fegyverei és árui. Minden játékosnak ugyanaz a beállítás kell. Módosítás után indítsd újra.
